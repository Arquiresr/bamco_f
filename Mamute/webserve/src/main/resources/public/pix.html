        <style>
            .caixa1 {

                background: #f8f9fa;
                border-radius: 8px;
                transition: all 0.3s ease;
                top:40%;
            }
            
            .pavor {
                cursor: pointer;
                user-select: none;
                transition: transform 0.3s ease;
                display: inline-block;
                left:90%;
            }
            
            .pavor:hover {
                transform: scale(1.2);
            }
            
            .pavor.active {
                transform: rotate(90deg);
            }
            
            .borde-dinheiro {
                cursor: pointer;
            }
            
            .historico-transacoes {
                max-height: 300px;
                overflow-y: auto;
            }
